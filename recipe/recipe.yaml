schema_version: 1

context:
  name: dtool_azure
  version: "0.7.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/dtool-azure/dtool-azure-${{ version }}.tar.gz
  sha256: e78ce652565689307aee40a7acf0c1d8a4209757588002afbcbc1e61b3dedb3a

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python >=3.6
  run:
    - azure-storage-blob ==2.1.0
    - azure-storage-common ==2.1.0
    - dtoolcore >=3.17
    - python >=3.6

tests:
  - python:
      imports:
        - dtool_azure
      pip_check: true

      python_version: ${{ python_min }}.*
about:
  license: MIT
  license_file: LICENSE.rst
  summary: Add Azure storage support to dtool
  description: |
    Add Azure storage support to dtool. Copy datasets to and from Azure
    storage. List all the datasets in a Azure storage account. Create
    datasets directly in Azure storage.
  homepage: https://github.com/jic-dtool/dtool-azure
  repository: https://github.com/jic-dtool/dtool-azure
  documentation: https://github.com/jic-dtool/dtool-azure

extra:
  recipe-maintainers:
    - jan-janssen
